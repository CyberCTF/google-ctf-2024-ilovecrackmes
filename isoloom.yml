# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# ilovecrackmes (Google's 2024 security competition, by Google; a reversing challenge) as an Isoloom spec:
# a crackme built on Paillier public-key cryptography.
# The challenge folder 2024/quals/rev-ilovecrackmes of Google's challenge archive is vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2024-ilovecrackmes

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.60.199.0/24, internet: false }

machines:
  challenge:
    networks: { lab: 10 }
    services: [{ port: 1337, name: challenge, publish: 1337 }]
    resources: { cpus: 1, memory_mb: 512 }
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /chroot/home/user }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: app/challenge
      init: [ctf/flag.sh]

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the crackme sends its encrypted challenge as a long hexadecimal number
    script: checks/probe.sh
    wait: 60

message: |
  ilovecrackmes (Google, 2024) answers at `nc localhost {{ machines.challenge.services.0.publish }}`.
  The crackme computes on encrypted values: what can you compute without the private key?
